version: 2
updates:
  # Keeps the SHA-pinned GitHub Actions and reusable workflows (such as the ASH scan) up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
