name: ASH
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ash:
    uses: awslabs/automated-security-helper/.github/workflows/run-ash-security-scan.yml@main
    permissions:
      contents: read
      checks: write
      pull-requests: write
    with:
      ash-version: main
      ash-args: --fail-on-incomplete-scanners --no-allow-stale-content-db
      collect-sarif-report: false
  sarif:
    needs: ash
    if: ${{ !cancelled() && needs.ash.outputs.artifact-id != '' }}
    uses: awslabs/automated-security-helper/.github/workflows/upload-ash-sarif.yml@main
    permissions:
      contents: read
      security-events: write
      actions: read
